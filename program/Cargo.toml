[package]
name = "halfkey"
version = "0.1.0"
edition = "2021"
description = "HALFKEY: trustless SOL <-> XMR atomic swap escrow (Solana side)"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# e2e builds only: short MIN_UNBOND_SECS / MIN_PROOF_WINDOW so a local validator can reach them.
test-timelocks = []

[dependencies]
solana-program-entrypoint = "3.1.1"
solana-account-info = "3.1.1"
solana-pubkey = { version = "3.0.0", features = ["curve25519"] }
solana-program-error = "3.0.1"
solana-msg = "3.1.0"
solana-cpi = "3.1.0"
solana-instruction = "3.0"
solana-sysvar = "3.1.1"
solana-clock = "3.0"
solana-rent = "3.1.0"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
# Pinned: from agave v4 the wrapper moves behind `agave-unstable-api`; the syscall itself is stable consensus.
solana-curve25519 = "=3.1.14"
solana-instructions-sysvar = "3.0.1"
solana-sha256-hasher = "3.1.0"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }

[dev-dependencies]
# Canonical program ids, for lib.rs tests::program_ids_match_crates.
solana-sdk-ids = "3.1.0"
spl-generic-token = "=2.0.1"
proptest = "1"
curve25519-dalek = "4"
serde_json = "1"

[workspace]
